<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zen16 — Đồng hành tỉnh thức</title>
  <meta name="description"
    content="Đồng hành tâm linh với AI - Zen16 mang trí tuệ Thích Nhất Hạnh đến với bạn qua công nghệ">
  <meta name="keywords" content="thiền, mindfulness, Thích Nhất Hạnh, meditation, mental health, AI, Vietnam">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet">

  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zen16">

  <meta property="og:title" content="Zen16 — Đồng hành tỉnh thức">
  <meta property="og:description" content="AI Zen Master lấy cảm hứng từ Thích Nhất Hạnh">
  <meta property="og:type" content="website">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════
       ZEN16 GUARDIAN — Design System v2.0 "Wabi-Sabi Futurism"
       ═══════════════════════════════════════════════════════════ */

    :root {
      /* ── Color Palette ── */
      --zen-black: #0a0908;
      --zen-ink: #1c1917;
      --zen-charcoal: #292524;
      --zen-stone-dark: #57534e;
      --zen-stone: #78716c;
      --zen-stone-light: #a8a29e;
      --zen-cream: #f5f0eb;
      --zen-parchment: #faf8f5;
      --zen-white: #fefefe;

      /* Accent — Saffron Robe (Cà Sa) */
      --zen-saffron-deep: #c2410c;
      --zen-saffron: #ea580c;
      --zen-saffron-mid: #f97316;
      --zen-saffron-light: #fb923c;
      --zen-saffron-glow: #fed7aa;

      /* Emotion Gradients */
      --grad-neutral: linear-gradient(135deg, #64748b 0%, #94a3b8 50%, #e2e8f0 100%);
      --grad-joyful: linear-gradient(135deg, #b45309 0%, #f59e0b 50%, #fef3c7 100%);
      --grad-sad: linear-gradient(135deg, #1e3a5f 0%, #3b82f6 50%, #bfdbfe 100%);
      --grad-anxious: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #fed7aa 100%);
      --grad-calm: linear-gradient(135deg, #064e3b 0%, #10b981 50%, #d1fae5 100%);
      --grad-seeking: linear-gradient(135deg, #4c1d95 0%, #8b5cf6 50%, #ede9fe 100%);
      --grad-stressed: linear-gradient(135deg, #881337 0%, #f43f5e 50%, #fecdd3 100%);
      --grad-confused: linear-gradient(135deg, #164e63 0%, #06b6d4 50%, #cffafe 100%);
      --grad-lonely: linear-gradient(135deg, #1e1b4b 0%, #6366f1 50%, #e0e7ff 100%);

      /* Glass Materials */
      --glass-clear: rgba(255, 255, 255, 0.72);
      --glass-frosted: rgba(255, 255, 255, 0.55);
      --glass-subtle: rgba(255, 255, 255, 0.35);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-border-strong: rgba(255, 255, 255, 0.65);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
      --glass-shadow-elevated: 0 16px 48px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
      --glass-shadow-saffron: 0 8px 32px rgba(249, 115, 22, 0.12), 0 2px 8px rgba(249, 115, 22, 0.06);

      /* Typography */
      --font-body: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      --font-wisdom: 'Cormorant Garamond', 'Georgia', serif;

      /* Motion — Spring-based Easings */
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);

      /* Spacing — 8px Grid */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;

      /* Radius */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-2xl: 40px;
      --radius-full: 999px;

      /* Background */
      --bg-gradient: radial-gradient(ellipse at 50% 0%, var(--zen-saffron-glow) 0%, var(--zen-parchment) 50%, var(--zen-cream) 100%);
    }

    /* ── Dark Zen Mode ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --glass-clear: rgba(28, 25, 23, 0.75);
        --glass-frosted: rgba(28, 25, 23, 0.6);
        --glass-subtle: rgba(28, 25, 23, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-border-strong: rgba(255, 255, 255, 0.15);
        --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
        --glass-shadow-elevated: 0 16px 48px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.25);
        --glass-shadow-saffron: 0 8px 32px rgba(249, 115, 22, 0.2), 0 2px 8px rgba(249, 115, 22, 0.1);
        --bg-gradient: radial-gradient(ellipse at 50% 0%, rgba(120, 53, 15, 0.15) 0%, var(--zen-black) 50%, #050403 100%);
      }
    }

    /* ── Base Styles ── */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
      background: var(--bg-gradient);
      background-attachment: fixed;
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    .font-serif,
    .font-wisdom {
      font-family: var(--font-wisdom);
      letter-spacing: 0.01em;
    }

    /* ── Glass Material Classes ── */
    .zen-glass {
      background: var(--glass-clear);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--glass-border-strong);
      box-shadow: var(--glass-shadow);
    }

    .zen-glass-subtle {
      background: var(--glass-frosted);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .zen-glass-elevated {
      background: var(--glass-clear);
      backdrop-filter: blur(32px) saturate(1.6);
      -webkit-backdrop-filter: blur(32px) saturate(1.6);
      border: 1px solid var(--glass-border-strong);
      box-shadow: var(--glass-shadow-elevated);
    }

    /* ── Noise Texture Overlay (Wabi-Sabi grain) ── */
    .zen-noise::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      z-index: 1;
    }

    /* ── Keyframe Animations ── */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideRight {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.8;
      }
    }

    @keyframes gentleSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 8px rgba(249, 115, 22, 0.25);
      }

      50% {
        box-shadow: 0 0 28px rgba(249, 115, 22, 0.5);
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.85);
        opacity: 0.5;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    @keyframes dotBreathe {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(1.5);
        opacity: 1;
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* ── Utility Animations ── */
    .animate-fadeIn {
      animation: fadeIn 0.5s var(--ease-smooth) both;
    }

    .animate-fadeInUp {
      animation: fadeInUp 0.6s var(--ease-smooth) both;
    }

    .animate-fadeInDown {
      animation: fadeInDown 0.5s var(--ease-smooth) both;
    }

    .animate-slideUp {
      animation: slideUp 0.5s var(--ease-spring) both;
    }

    .animate-scaleIn {
      animation: scaleIn 0.4s var(--ease-spring) both;
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    .animate-breathe {
      animation: breathe 4s ease-in-out infinite;
    }

    .animate-gentle-spin {
      animation: gentleSpin 8s linear infinite;
    }

    .animate-glow-pulse {
      animation: glowPulse 3s ease-in-out infinite;
    }

    .animate-pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .animate-dot-breathe {
      animation: dotBreathe 2.5s ease-in-out infinite;
    }

    .animate-gradient-shift {
      background-size: 200% 200%;
      animation: gradientShift 6s ease-in-out infinite;
    }

    .animate-spin-slow {
      animation: gentleSpin 3s linear infinite;
    }

    /* Stagger delays */
    .delay-1 {
      animation-delay: 0.1s;
    }

    .delay-2 {
      animation-delay: 0.2s;
    }

    .delay-3 {
      animation-delay: 0.3s;
    }

    .delay-4 {
      animation-delay: 0.4s;
    }

    .delay-5 {
      animation-delay: 0.5s;
    }

    /* ── Scrollbar Styles ── */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--zen-stone-light);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: var(--zen-stone);
    }

    /* ── Selection ── */
    ::selection {
      background: rgba(249, 115, 22, 0.2);
      color: var(--zen-ink);
    }

    /* ── Focus Visible ── */
    :focus-visible {
      outline: 2px solid var(--zen-saffron-mid);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>

<body class="bg-stone-50 text-stone-900 h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker failed', err));
      });
    }
  </script>
</body>

</html>
